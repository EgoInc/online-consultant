name: online-consult

services:
  frontend:
    build:
      context: .
      dockerfile: chat-app-example/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  backend:
    extends:
      file: backend/compose.yaml
      service: backend
    build:
      context: ./backend

  postgres:
    extends:
      file: backend/compose.yaml
      service: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro

volumes:
  postgres-data:
